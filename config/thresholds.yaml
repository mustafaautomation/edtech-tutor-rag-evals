# Bars the eval CLI enforces. Offline metrics are computed without an API key.
# Live metrics are judged by RAGAS only when --mode live has OPENAI_API_KEY set.
# Live metrics are averaged on questions whose expected behaviour is "answer".
offline:
  non_llm_context_recall: 0.80
  string_presence: 0.80
  refusal_correctness: 0.90
  hit_rate: 0.80
  mrr: 0.90
live:
  faithfulness: 0.70
  answer_relevancy: 0.70
  context_precision: 0.60
  context_recall: 0.70
